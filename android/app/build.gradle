plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// keystore.properties is generated once by tools\make_keystore.ps1 and is not in git.
def ks = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ks.load(new FileInputStream(ksFile))
def haveKeystore = ks['storeFile'] != null && rootProject.file(ks['storeFile']).exists()

android {
    namespace 'org.tenforward.radio'
    compileSdk 35

    defaultConfig {
        applicationId 'org.tenforward.radio'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            if (haveKeystore) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (haveKeystore) signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
    sourceSets { main { java.srcDirs += 'src/main/kotlin' } }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
