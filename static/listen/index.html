<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ten Forward Radio</title>
<link rel="icon" type="image/png" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="cap">TEN FWD</div>
  <div class="title"><h1>TEN FORWARD <small id="tagline">RADIO</small></h1></div>
  <div class="scan"><i></i></div>
</header>

<main>
  <section class="dial">
    <button id="dial-left" class="arrow" aria-label="previous channel">&#9664;</button>
    <div class="dialwin">
      <div class="needle"></div>
      <div id="strip" class="strip"><div class="pad"></div><div class="hint pad">Tuning…</div><div class="pad"></div></div>
    </div>
    <button id="dial-right" class="arrow" aria-label="next channel">&#9654;</button>
  </section>
  <div id="dial-name" class="dialname">&nbsp;</div>

  <section class="now">
    <div id="now" class="nowbox"><div class="hint">Turn the dial. Every song here is written and sung by an AI, live.</div></div>
    <div class="controls">
      <button id="btn-play" class="big" disabled>PLAY</button>
      <button id="btn-next" class="mini" disabled>NEXT</button>
      <a id="btn-dl" class="mini ghost" href="#" download hidden>DOWNLOAD</a>
    </div>
    <div id="cooking" class="cooking" hidden></div>
  </section>
</main>

<footer><span id="foot">DECK 10 · LOUNGE</span><span class="hint">Listening only. Songs rotate out after a few days.</span></footer>
<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
